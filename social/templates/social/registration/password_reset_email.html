<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:32px;background:#f5f7ff;font-family:Arial,sans-serif;color:#202845;">
    <div style="max-width:520px;margin:0 auto;padding:36px;background:#fff;border-radius:20px;">
        <p style="color:#6874a0;font-weight:bold;letter-spacing:2px;text-transform:uppercase;">ConnectHub account</p>
        <h1 style="font-size:26px;">Reset your password</h1>
        <p>We received a request to reset the password for your ConnectHub account.</p>
        <p style="margin:28px 0;">
            <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}" style="display:inline-block;padding:14px 22px;border-radius:10px;background:#5865e8;color:#fff;text-decoration:none;font-weight:bold;">Choose a new password</a>
        </p>
        <p>If you didn't request a password reset, you can safely ignore this email.</p>
    </div>
</body>
</html>
